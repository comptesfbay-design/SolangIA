<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suivi chantier</title>
  <meta name="description" content="Suivi de chantier pièce par pièce et lot par lot, utilisable hors connexion.">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171b21" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chantier">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Applique le thème choisi avant l'affichage (évite un flash de couleur).
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button id="back" class="icon-btn" type="button" aria-label="Retour" hidden>‹</button>
    <h1 id="title">Suivi chantier</h1>
    <div id="hdr-actions"></div>
  </header>
  <div id="scroller">
    <div id="banners"></div>
    <main id="main">
      <p class="muted">Chargement…</p>
      <noscript><p>Cette application a besoin de JavaScript.</p></noscript>
    </main>
  </div>
  <nav class="tabbar" aria-label="Navigation principale">
    <a href="#/" data-tab="home"><span class="ico" aria-hidden="true">🏠</span>Accueil</a>
    <a href="#/photos" data-tab="photos"><span class="ico" aria-hidden="true">📷</span>Photos</a>
    <a href="#/reglages" data-tab="settings"><span class="ico" aria-hidden="true">⚙️</span>Réglages</a>
  </nav>
  <script type="module" src="js/app.js"></script>
</body>
</html>
